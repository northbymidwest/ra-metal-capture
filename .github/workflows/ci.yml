name: CI

# This crate is macOS-only: it links AppKit through objc2-app-kit to size the
# RetroArch window, and drives Xcode's gpucapture(1). Jobs that COMPILE it run
# on macos-latest. Everything that does not compile it (lint, supply-chain,
# workflow lint, and, via `cargo metadata`, which does not run build scripts,
# deny/machete) runs on cheap, fast Ubuntu. The test suite is deterministic:
# it exercises config rendering, argument parsing, and the UDP command
# protocol against a fake on 127.0.0.1, and never launches RetroArch or
# gpucapture, so it runs here in full. The tool itself requires macOS 27 and
# Xcode 27, one above what macos-latest currently provisions; that does not
# matter here because nothing in CI runs it, only compiles it.
on:
  push:
    branches: [main]
  pull_request:
  # Toolchains move between commits; a weekly unprompted run catches breakage
  # that would otherwise sit unseen until the next push. Off the hour so it
  # does not queue behind everyone else's :00 cron. GitHub disables a
  # public-repo schedule after 60 days without a commit and mails the owner.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # fmt / ascii / typos. No compilation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: ./scripts/check-ascii.sh
      - uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1.49.1

  supply-chain:
    # cargo-deny and cargo-machete resolve metadata but do not compile
    # (cargo metadata does not run build scripts), so they run on Ubuntu.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-machete@0.9.2
      # Advisories are audit.yml's job; here it is licenses/bans/sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
      - run: cargo machete

  workflows:
    # Lints the workflow files themselves (actionlint) and audits them for
    # security anti-patterns (zizmor). No compilation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          # go is preinstalled on the Ubuntu runner; pin actionlint by tag.
          SHELLCHECK_OPTS: -e SC2016
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      # Uploads findings to code scanning (non-blocking).
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github
          advanced-security: true
      # The blocking pass.
      - name: zizmor (blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --no-progress .github

  macos:
    # Everything that COMPILES the crate: build, clippy, the test suite, and
    # rustdoc. Blocking: none of it needs RetroArch, Xcode, or a GPU.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo build
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  msrv:
    # Verifies the declared MSRV floor still builds. Compiles on macos-latest,
    # blocking like the macos job.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo '::error::no rust-version in Cargo.toml'; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo build
