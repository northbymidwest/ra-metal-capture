name: Bug report
description: Report a bug in ra-metal-capture.
labels: ["bug"]
assignees: ["northbymidwest"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. This tool drives a RetroArch process and
        Xcode's `gpucapture(1)`, so a self-contained repro plus your exact
        `rustc`, macOS, and RetroArch versions is what makes a bug
        actionable. If the issue is a suspected memory-safety or soundness
        problem, please report it privately instead: see
        `.github/SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The command line you ran with `-v`, and everything it printed (the appendconfig, the RetroArch command line, and the error).
      render: shell
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc -Vv`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`.
    validations:
      required: true
  - type: input
    id: retroarch
    attributes:
      label: RetroArch version
      description: Output of `/Applications/RetroArch.app/Contents/MacOS/RetroArch --version`, and which core.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `ra-metal-capture --version`, or the git SHA you are on.
    validations:
      required: true
