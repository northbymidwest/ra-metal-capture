[package]
name = "ra-metal-capture"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Launch RetroArch with a ROM, save state and shader preset, then capture frames to .gputrace with gpucapture"
license = "0BSD"
repository = "https://github.com/northbymidwest/ra-metal-capture"
readme = "README.md"
keywords = ["macos", "metal", "gpu", "gputrace", "retroarch"]
categories = ["command-line-utilities", "development-tools::profiling"]
# What a `cargo install` needs: the code, its tests, and the README/LICENSE.
# Repository tooling and the design docs stay in git.
exclude = [
    "/.github/",
    "/.githooks/",
    "/docs/",
    "/scripts/",
    "/deny.toml",
    "/typos.toml",
    "/RELEASING.md",
]

# docs.rs builds on Linux; this crate links AppKit through objc2-app-kit,
# which only the Apple targets provide. Document the Apple target only.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[lib]
name = "ra_metal_capture"
path = "src/lib.rs"

[[bin]]
name = "ra-metal-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"
nix = { version = "0.31.3", features = ["signal"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSScreen"] }
