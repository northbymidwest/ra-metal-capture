[package]
name = "ra-metal-capture"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "Record a Metal frame trace (.gputrace) of a shader preset, in-process through librashader or from RetroArch"
license = "0BSD"
repository = "https://github.com/northbymidwest/ra-metal-capture"
readme = "README.md"
keywords = ["macos", "metal", "gpu", "gputrace", "retroarch"]
categories = ["command-line-utilities", "development-tools::profiling"]
# What a `cargo install` needs: the code, its tests and their fixture
# (fixtures/sample.png), and the README/LICENSE. Repository tooling and the design
# docs stay in git.
exclude = [
    "/.github/",
    "/.githooks/",
    "/docs/",
    "/scripts/",
    "/deny.toml",
    "/typos.toml",
    "/RELEASING.md",
    "/CLAUDE.md",
]

# docs.rs builds on Linux; this crate links AppKit through objc2-app-kit,
# which only the Apple targets provide. Document the Apple target only.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
# docs.rs builds on Linux with the Apple target above, and `cargo doc` runs
# dependency build scripts, so the librashader feature's C++ (glslang,
# SPIRV-Cross) cannot build there. Document the RetroArch-only shape.
no-default-features = true

[features]
default = ["librashader"]
# The in-process image backend: librashader's Metal runtime plus Metal's
# capture API. Without it the tool is RetroArch-only and builds no C++.
librashader = ["dep:librashader", "dep:objc2", "dep:objc2-metal", "dep:image", "dep:libretro-sys", "dep:libloading", "dep:flate2"]

[lib]
name = "ra_metal_capture"
path = "src/lib.rs"

[[bin]]
name = "ra-metal-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"
nix = { version = "0.31.3", features = ["signal", "fs"] }
ctrlc = "3.5.2"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3.2", features = ["NSScreen"] }
# librashader backend (feature "librashader")
librashader = { version = "0.12.0", optional = true, default-features = false, features = ["runtime-metal", "presets", "preprocess"] }
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", optional = true, features = [
    "MTLCaptureManager",
    "MTLCommandBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
image = { version = "0.25.8", optional = true, default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga", "pnm", "hdr"] }
libretro-sys = { version = "0.1.1", optional = true }
libloading = { version = "0.9.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
